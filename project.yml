name: BOKKIColor
options:
  bundleIdPrefix: com.bokki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4FWG8XXYM7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BOKKIColor:
    type: application
    platform: iOS
    sources:
      - BOKKIColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bokki.checker
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BOKKI Checker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
  BOKKIColorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BOKKIColorTests
    dependencies:
      - target: BOKKIColor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BOKKIColor:
    build:
      targets:
        BOKKIColor: all
        BOKKIColorTests: [test]
    test:
      targets:
        - BOKKIColorTests
